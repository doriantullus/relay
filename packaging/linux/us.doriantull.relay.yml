app-id: us.doriantull.relay
runtime: org.gnome.Platform
runtime-version: '48'
sdk: org.gnome.Sdk
command: relay
finish-args:
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri
  - --filesystem=home
  - --talk-name=org.freedesktop.secrets
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.freedesktop.Flatpak
modules:
  - name: relay
    buildsystem: simple
    build-options:
      build-args:
        - --share=network
    build-commands:
      - zig build -Doptimize=ReleaseSafe --prefix=/app
    sources:
      - type: dir
        path: ../..
