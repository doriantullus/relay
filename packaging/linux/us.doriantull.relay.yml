app-id: us.doriantull.relay
runtime: org.gnome.Platform
runtime-version: '48'
sdk: org.gnome.Sdk
command: relay
finish-args:
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri
  - --filesystem=home
  - --talk-name=org.freedesktop.secrets
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.freedesktop.Flatpak
modules:
  - name: zig
    buildsystem: simple
    build-commands:
      - mkdir -p /app/bin /app/zig
      - cp -a zig lib /app/zig/
      - ln -s ../zig/zig /app/bin/zig
    sources:
      - type: archive
        url: https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz
        sha256: 70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00
        only-arches:
          - x86_64
      - type: archive
        url: https://ziglang.org/download/0.16.0/zig-aarch64-linux-0.16.0.tar.xz
        sha256: ea4b09bfb22ec6f6c6ceac57ab63efb6b46e17ab08d21f69f3a48b38e1534f17
        only-arches:
          - aarch64
  - name: relay
    buildsystem: simple
    build-options:
      build-args:
        - --share=network
    build-commands:
      - zig build -Doptimize=ReleaseSafe --prefix /app
    sources:
      - type: dir
        path: ../..
