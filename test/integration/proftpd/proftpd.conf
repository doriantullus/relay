# Relay integration config: explicit FTPS via mod_tls, default session-
# reuse enforcement on data connections (NoSessionReuseRequired NOT set).
ServerName "relay-proftpd"
ServerType standalone
DefaultServer on
# Containers have unresolvable hostnames; without this proftpd exits with
# "no valid servers configured".
DefaultAddress 0.0.0.0
Port 21
UseIPv6 off
PassivePorts 42330 42339
# PASV fallback only — EPSV replies carry no address. The container IP is
# unroutable from the host.
MasqueradeAddress 127.0.0.1

User proftpd
Group nogroup
AuthOrder mod_auth_unix.c
RequireValidShell off
DefaultRoot ~
AllowOverwrite on
# REST + STOR (upload resume) is refused without this.
AllowStoreRestart on

WtmpLog off
ScoreboardFile /run/proftpd.scoreboard
PidFile /run/proftpd.pid

# Debian ships mod_tls as a DSO in proftpd-mod-crypto.
<IfModule mod_dso.c>
  LoadModule mod_tls.c
</IfModule>

<IfModule mod_tls.c>
  TLSEngine on
  TLSRSACertificateFile /etc/ssl/certs/proftpd.crt
  TLSRSACertificateKeyFile /etc/ssl/private/proftpd.key
  TLSRequired on
  TLSVerifyClient off
  # No TLSLog: mod_tls refuses symlinks like /proc/self/fd/2.
</IfModule>
