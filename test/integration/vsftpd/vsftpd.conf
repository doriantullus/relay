# Relay integration config: explicit FTPS (AUTH TLS) with mandatory TLS
# session reuse on data connections — the interop case std.crypto.tls
# cannot satisfy and the reason Relay vendors LibreSSL.
listen=YES
listen_ipv6=NO
background=NO

# Container quirks: vsftpd's seccomp sandbox and namespace isolation both
# break under Docker's default confinement.
seccomp_sandbox=NO
isolate=NO
isolate_network=NO

local_enable=YES
write_enable=YES
local_umask=022
chmod_enable=YES
chroot_local_user=YES
# The chroot root (= the user's home) is intentionally writable for tests.
allow_writeable_chroot=YES
xferlog_enable=NO

pasv_enable=YES
pasv_min_port=42130
pasv_max_port=42139
# EPSV replies carry only a port; the suite dials 127.0.0.1 (published
# ports). pasv_address covers any PASV fallback path.
pasv_address=127.0.0.1
pasv_addr_resolve=NO

ssl_enable=YES
# THE setting under test: reject data connections that do not resume the
# control connection's TLS session.
require_ssl_reuse=YES
force_local_logins_ssl=YES
force_local_data_ssl=YES
allow_anon_ssl=NO
# Debian bookworm ships vsftpd 3.0.3, which predates the ssl_tlsv1_1 /
# ssl_tlsv1_2 options (3.0.4+) and dies on them. ssl_tlsv1=YES means
# "TLSv1 or newer" here; OpenSSL 3 negotiates 1.2/1.3 in practice.
ssl_tlsv1=YES
ssl_sslv2=NO
ssl_sslv3=NO
# vsftpd's default is the ancient DES-CBC3-SHA, which modern TLS stacks
# refuse; without this the handshake fails before reuse is even exercised.
ssl_ciphers=HIGH
rsa_cert_file=/etc/ssl/certs/vsftpd.crt
rsa_private_key_file=/etc/ssl/private/vsftpd.key
